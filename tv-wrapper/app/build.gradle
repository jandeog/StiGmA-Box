plugins {
    id "com.android.application"
}

android {
    namespace "com.stigmabox.cams.display"
    compileSdk 35

    defaultConfig {
        applicationId "com.stigmabox.cams.display.debug"
        minSdk 23
        targetSdk 34
        versionCode 102
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            def ks = System.getenv("CAMS_KEYSTORE")
            def sp = System.getenv("CAMS_STORE_PASSWORD")
            def ka = System.getenv("CAMS_KEY_ALIAS")
            def kp = System.getenv("CAMS_KEY_PASSWORD")
            if (ks && sp && ka && kp) {
                storeFile file(ks)
                storePassword sp
                keyAlias ka
                keyPassword kp
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
